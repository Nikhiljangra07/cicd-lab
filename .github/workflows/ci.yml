name: CI

on:
  push:
    branches: [main]          # only main pushes; branches are covered by pull_request (no more double runs)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04     # pinned: "latest" changes under you on a date GitHub picks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test               # waits for test; skipped entirely if test is red
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4   # hand dist/ to later jobs
        with:
          name: dist
          path: dist/
  smoke:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for Railway to serve this commit's deploy
        run: |
          URL="https://cicd-lab-production.up.railway.app/health"
          for i in $(seq 1 30); do
            BODY=$(curl -sS -m 10 "$URL" || true)
            echo "attempt $i: $BODY"
            if echo "$BODY" | grep -q '"ok":true'; then exit 0; fi
            sleep 10
          done
          echo "service never answered ok within 5 minutes"; exit 1
