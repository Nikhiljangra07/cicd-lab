name: CI

on:
  push:
    branches: [main]          # only main pushes; branches are covered by pull_request (no more double runs)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04     # pinned: "latest" changes under you on a date GitHub picks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test               # waits for test; skipped entirely if test is red
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4   # hand dist/ to later jobs
        with:
          name: dist
          path: dist/
  
